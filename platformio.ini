; Projeto PlatformIO do carrinho.
; O codigo fica em carrinho_iot/ para continuar abrindo na Arduino IDE.
;
; Ambientes:
;   esp32      -> grava pelo cabo USB (padrao)
;   esp32-ota  -> grava pelo Wi-Fi (precisa do secrets.ini)

[platformio]
src_dir = carrinho_iot
default_envs = esp32
extra_configs = secrets.ini

; Valores padrao; o secrets.ini substitui.
[ota]
endereco = carrinho-iot.local
senha =

[env:esp32]
; espressif32 6.12.0 = Arduino-ESP32 2.0.17, a mesma versao do carrinho
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
lib_deps = blynkkk/Blynk@^1.3.2
monitor_speed = 9600
upload_speed = 460800

[env:esp32-ota]
extends = env:esp32
upload_protocol = espota
upload_port = ${ota.endereco}
upload_flags = --auth=${ota.senha}
