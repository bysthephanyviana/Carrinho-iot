; Projeto PlatformIO do carrinho.
; O codigo fica em carrinho_iot/ para continuar abrindo na Arduino IDE.

[platformio]
src_dir = carrinho_iot

[env:esp32]
; espressif32 6.12.0 = Arduino-ESP32 2.0.17, a mesma versao do carrinho
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
lib_deps = blynkkk/Blynk@^1.3.2
monitor_speed = 9600
upload_speed = 460800
